# Publish to the npm registry on version tags (v0.1.0, v0.1.1, ...).
#
# Prerequisites (one-time, maintainer):
#   1. Create the GitHub repository and push `main` (this repo must be public
#      for npm provenance).
#   2. Fill `repository` / `bugs` / `homepage` in package.json so the published
#      metadata and npm provenance point at the GitHub repo.
#   3. Add an npm automation token as the `NPM_TOKEN` repository secret
#      (npmjs.com -> Access Tokens -> "Automation"; scope: publish).
#
# Release flow: `npm version patch -m "chore: release v%s" && git push --tags`
# -> this workflow builds and publishes the package.
name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance (requires a public repo + repository field)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
